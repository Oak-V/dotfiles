general.import = [
	"~/.catppuccin/alacritty/catppuccin-mocha.toml",
]

[terminal.shell]
program="/opt/homebrew/bin/zsh"
args = ["-d", "-l"]

[terminal]
osc52 = "CopyPaste"

[selection]
save_to_clipboard = true

[window]
decorations="Buttonless"
dynamic_padding=true
opacity=0.90
startup_mode="SimpleFullscreen"
blur=true
resize_increments=true
level="AlwaysOnTop"

[font]
size=14.0

[font.normal]
family="JetBrainsMono Nerd Font"
style="Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style="Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style="Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[colors]
transparent_background_colors=true

[cursor.style]
blinking="Always"

[scrolling]
history=0
multiplier=0

[mouse]
hide_when_typing = true
bindings = [
#   { mouse = "Middle", action = "ReceiveChar" },
   { mouse = "Right", action = "ReceiveChar" },
   { mouse = "Right", mods = "Control", action = "ReceiveChar" },
   { mouse = "Left", action = "ReceiveChar" },
   { mouse = "Left", mods = "Control", action = "ReceiveChar" },
]

[hints]
enabled = []

[keyboard]
bindings = [
   { key = "Paste", action = "ReceiveChar" },
   { key = "Copy", action = "ReceiveChar" },
   { key = "L", mods = "Control", action = "ReceiveChar" },
   { key = "Paste", mode = "Vi|Search", action = "ReceiveChar" },
   { key = "L", mods = "Control", mode = "~Vi|~Search", action = "ReceiveChar" },
